[project]
name = "swarm-ledger"
version = "0.0.1"
description = "Local stdio MCP server for the sentinel-swarm plugin: a SQLite ledger of runs, phases, briefs, file claims, reviews, scores, and agent activity."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alexk413x", email = "alexk413x@gmail.com" }]
license = { text = "LicenseRef-Proprietary" }
dependencies = [
    "fastmcp>=4.0.3,<5",
    "pyyaml>=6.0.3",
]

[project.scripts]
swarm-ledger = "swarm_ledger.server:main"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_ledger"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.400",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: slower tests that call an external tool (deselect with -m 'not integration')"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: Release branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the version if its tag is missing
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="sentinel-swarm--v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
          else
            title=$(sed -n "s/^## \[$version\] — [0-9-]* — //p" CHANGELOG.md | head -n 1)
            git tag -a "$tag" -m "sentinel-swarm $version${title:+ — $title}"
            git push origin "$tag"
          fi
          git fetch -q --depth=1 origin release:refs/remotes/origin/release || true
          released=$(git show origin/release:.claude-plugin/plugin.json 2>/dev/null | python3 -c "import json, sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || true)
          if [ "$released" = "$version" ]; then
            echo "The release branch holds $version, so main holds changes that are not released. Bump the version to release them."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the release branch without development files
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git rm -r -q .claude AGENTS.md .gitattributes .githooks .github .gitignore evals knowledge plans scripts \
            hooks/register.test.ts mcp/tests mcp/src/swarm_ledger/server.py
          git commit -q -m "Release build of ${GITHUB_SHA::7}"
          git push -f origin release

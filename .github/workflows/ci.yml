name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate --strict .claude-plugin/plugin.json

  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: mcp
        run: uv sync --frozen

      - name: Show Python version
        working-directory: mcp
        run: uv run python --version

      - name: Lint
        working-directory: mcp
        run: uv run ruff check

      - name: Check formatting
        working-directory: mcp
        run: uv run ruff format --check

      - name: Type check
        working-directory: mcp
        run: uv run pyright

      - name: Test
        working-directory: mcp
        run: uv run pytest

  runtime-python-3-9:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Run the launcher on Python 3.9
        working-directory: mcp
        run: uv run --no-project --python 3.9 python -I -S launch/ledger.py directive --help

      - name: Test the launcher and the frontmatter parser on Python 3.9
        working-directory: mcp
        run: >
          uv run --no-project --python 3.9 --with "pytest>=8,<9" --with pyyaml
          python -m pytest -q -o pythonpath=src tests/test_ledger_launcher.py tests/test_frontmatter.py
